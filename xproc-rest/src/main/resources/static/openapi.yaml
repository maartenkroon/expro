openapi: 3.0.3
info:
  title: XProc REST API
  version: 1.0.0
  description: |
    REST interface to the Armatiek XProc 3.1 processor.

    Pipelines can be compiled once and stored under an identifier (`PUT /pipelines/{pipelineId}`)
    and then be run any number of times, or they can be compiled and run in a single request
    (`POST /runs`).

    Documents are exchanged in JSON envelopes (`Document`) that carry the content type, the
    content (as text or base64) and the base URI of a document. For simple one-document
    pipelines, `POST /pipelines/{pipelineId}/transform` takes the primary input document as the
    raw request body and returns the primary output document as the raw response body.

    Errors are reported as RFC 9457 problem details (`application/problem+json`) extended with
    the XProc error code and the location of the error.

    Names of options and document properties are given as EQNames (`Q{uri}local`), as
    unprefixed names, or as prefixed names whose prefixes are bound in `namespaces`.
  license:
    name: Apache-2.0
servers:
  - url: /api/v1
tags:
  - name: processor
    description: Information about the processor
  - name: pipelines
    description: Compiled pipelines and their invocation
  - name: runs
    description: Ad-hoc pipeline runs
paths:
  /processor:
    get:
      tags: [processor]
      operationId: getProcessorInfo
      summary: Describes the XProc processor
      responses:
        '200':
          description: Processor information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorInfo'
  /pipelines:
    get:
      tags: [pipelines]
      operationId: listPipelines
      summary: Lists the compiled pipelines
      responses:
        '200':
          description: The compiled pipelines, ordered by identifier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineDescription'
  /pipelines/{pipelineId}:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    put:
      tags: [pipelines]
      operationId: putPipeline
      summary: Compiles a pipeline and stores it under the identifier
      description: |
        The request body is the XML pipeline document (a `p:declare-step` or a `p:library`
        containing exactly one step). An existing pipeline with the same identifier is
        replaced.
      parameters:
        - name: baseUri
          in: query
          description: Base URI of the pipeline document, used to resolve relative URIs.
          schema:
            type: string
            format: uri
        - name: staticOption
          in: query
          description: |
            Values of static options as `NAME=VALUE` pairs. The value is passed as
            `xs:untypedAtomic`.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: namespace
          in: query
          description: Namespace bindings for prefixed option names as `PREFIX=URI` pairs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The pipeline replaced an existing one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDescription'
        '201':
          description: The pipeline was compiled and stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDescription'
        '400':
          $ref: '#/components/responses/StaticError'
    get:
      tags: [pipelines]
      operationId: getPipeline
      summary: Describes a compiled pipeline
      responses:
        '200':
          description: The pipeline signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDescription'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [pipelines]
      operationId: deletePipeline
      summary: Removes a compiled pipeline
      responses:
        '204':
          description: The pipeline was removed
        '404':
          $ref: '#/components/responses/NotFound'
  /pipelines/{pipelineId}/source:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    get:
      tags: [pipelines]
      operationId: getPipelineSource
      summary: Returns the source of a compiled pipeline
      responses:
        '200':
          description: The pipeline document as it was uploaded
          content:
            application/xml:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /pipelines/{pipelineId}/runs:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    post:
      tags: [pipelines]
      operationId: runPipeline
      summary: Runs a compiled pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '200':
          description: The pipeline ran successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/DynamicError'
  /pipelines/{pipelineId}/transform:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    post:
      tags: [pipelines]
      operationId: transform
      summary: Runs a compiled pipeline on a single raw document
      description: |
        The request body is connected to the primary input port, with the `Content-Type` of
        the request as its content type. When the request has no body, the primary input port
        keeps its default connection. The response body is the single document that appears on
        the primary output port, serialized with the serialization parameters of that port;
        the response has status 204 when that port produces no documents. If the port
        produces more than one document, the request fails with status 422; use
        `POST /pipelines/{pipelineId}/runs` instead.
      parameters:
        - name: option
          in: query
          description: Option values as `NAME=VALUE` pairs (passed as `xs:untypedAtomic`).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: namespace
          in: query
          description: Namespace bindings for prefixed option names as `PREFIX=URI` pairs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: baseUri
          in: query
          description: Base URI of the input document.
          schema:
            type: string
            format: uri
      requestBody:
        required: false
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The document on the primary output port
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '204':
          description: The primary output port produced no documents
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/DynamicError'
  /runs:
    post:
      tags: [runs]
      operationId: runAdHoc
      summary: Compiles and runs a pipeline in one request
      description: The pipeline is not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdHocRunRequest'
      responses:
        '200':
          description: The pipeline ran successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '400':
          $ref: '#/components/responses/StaticError'
        '422':
          $ref: '#/components/responses/DynamicError'
components:
  parameters:
    PipelineId:
      name: pipelineId
      in: path
      required: true
      description: Identifier of the pipeline.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
  responses:
    NotFound:
      description: There is no pipeline with this identifier
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StaticError:
      description: The request is invalid, or the pipeline contains a static error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DynamicError:
      description: A dynamic error occurred while running the pipeline
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ProcessorInfo:
      type: object
      required: [productName, productVersion, xprocVersion, saxonVersion, saxonEdition]
      properties:
        productName:
          type: string
          example: Armatiek XProc
        productVersion:
          type: string
          example: 1.0.0
        xprocVersion:
          type: string
          example: '3.1'
        saxonVersion:
          type: string
          example: '13.1'
        saxonEdition:
          type: string
          example: HE
        fileAccess:
          type: boolean
          description: Whether pipelines may access file URIs
        networkAccess:
          type: boolean
          description: Whether pipelines may access the network
    PipelineDescription:
      type: object
      required: [id, inputs, outputs, options]
      properties:
        id:
          type: string
        type:
          type: string
          description: The step type of the pipeline as an EQName, if it has one
        baseUri:
          type: string
          format: uri
        compiledAt:
          type: string
          format: date-time
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/PortDescription'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/PortDescription'
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionDescription'
    PortDescription:
      type: object
      required: [name, primary, sequence]
      properties:
        name:
          type: string
        primary:
          type: boolean
        sequence:
          type: boolean
        contentTypes:
          type: string
          description: The content-types of the port (absent means any content type)
        hasDefault:
          type: boolean
          description: True for input ports that have a default connection
    OptionDescription:
      type: object
      required: [name, required, static]
      properties:
        name:
          type: string
          description: The option name as an EQName
        type:
          type: string
          description: The declared sequence type (absent means item()*)
        required:
          type: boolean
        static:
          type: boolean
        defaultExpression:
          type: string
    PipelineSource:
      type: object
      required: [source]
      properties:
        source:
          type: string
          description: The XML pipeline document
        baseUri:
          type: string
          format: uri
          description: Base URI of the pipeline document
        staticOptions:
          type: object
          description: Values of static options (passed as xs:untypedAtomic)
          additionalProperties:
            type: string
    RunRequest:
      type: object
      properties:
        inputs:
          type: object
          description: |
            Documents for input ports, by port name. An empty array connects the port to an
            empty sequence; ports that are not mentioned keep their default connection.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Document'
        options:
          type: object
          description: Option values, passed as xs:untypedAtomic and cast to the declared type.
          additionalProperties:
            type: string
        xpathOptions:
          type: object
          description: Option values given as XPath expressions, evaluated without context item.
          additionalProperties:
            type: string
        namespaces:
          type: object
          description: Namespace bindings (prefix to URI) for option names and XPath expressions.
          additionalProperties:
            type: string
        outputs:
          type: array
          description: The output ports to return (default all ports).
          items:
            type: string
    AdHocRunRequest:
      allOf:
        - $ref: '#/components/schemas/RunRequest'
        - type: object
          required: [pipeline]
          properties:
            pipeline:
              $ref: '#/components/schemas/PipelineSource'
    Encoding:
      type: string
      description: |
        How the content is encoded: `text` for the (serialized) text, `base64` for the
        base64 encoded bytes.
      enum: [text, base64]
    Document:
      type: object
      description: |
        A document. As input, a document is given by its `content` or loaded from its `href`
        (which requires file or network access). Text content of XML, HTML, JSON and text
        documents is parsed according to the content type; other documents are binary.
      properties:
        contentType:
          type: string
          description: |
            The media type of the document. As input it defaults to application/xml for
            inline content, and is derived from the resource for `href`.
          example: application/xml
        content:
          type: string
        encoding:
          $ref: '#/components/schemas/Encoding'
        href:
          type: string
          format: uri
          description: (Input only) URI of a document to load instead of inline content.
        baseUri:
          type: string
          format: uri
        properties:
          type: object
          description: |
            Document properties (other than content-type and base-uri). As output, values are
            given by their string value. As input, values are passed as xs:untypedAtomic.
          additionalProperties:
            type: string
    Message:
      type: object
      required: [level, message]
      properties:
        level:
          type: string
          enum: [DEBUG, INFO, WARNING, ERROR]
        step:
          type: string
          description: The name of the step that produced the message
        message:
          type: string
    RunResult:
      type: object
      required: [outputs, messages, durationMillis]
      properties:
        primaryOutput:
          type: string
          description: The name of the primary output port, if any
        outputs:
          type: object
          description: The documents on the output ports, by port name.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Document'
        messages:
          type: array
          description: Messages produced during the run ([p:]message, p:message, xsl:message).
          items:
            $ref: '#/components/schemas/Message'
        durationMillis:
          type: integer
          format: int64
    Problem:
      type: object
      description: RFC 9457 problem details, extended with XProc error information.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          description: The XProc error code as an EQName, e.g. Q{http://www.w3.org/ns/xproc-error}XD0030
          example: Q{http://www.w3.org/ns/xproc-error}XS0001
        causeCode:
          type: string
          description: The underlying (for example XPath) error code as an EQName
        location:
          type: string
          description: URI of the pipeline document in which the error occurred
        line:
          type: integer
        column:
          type: integer
        step:
          type: string
          description: The name of the step in which the error occurred
        stepType:
          type: string
          description: The type of the step in which the error occurred, as an EQName
