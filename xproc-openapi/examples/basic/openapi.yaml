openapi: 3.1.0
info:
  title: Example XProc service
  version: 1.0.0
  description: >
    Each operation is implemented by the XProc pipeline `<operationId>.xpl` in this directory.
servers:
  - url: /api/v1
paths:
  /greetings/{name}:
    get:
      operationId: getGreeting
      summary: Greets someone in the requested language
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: query
          schema:
            type: string
            enum: [en, nl]
            default: en
        - name: repeat
          in: query
          schema:
            type: integer
            default: 1
        - name: X-Request-Id
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The greeting
          content:
            application/xml: {}
  /transform:
    post:
      operationId: transformDocument
      summary: Transforms an XML document with transform.xsl
      requestBody:
        required: true
        content:
          application/xml:
            # A schema gives Swagger UI an editor for the body ("Try it out")
            schema:
              type: string
            examples:
              document:
                value: <doc><a/><b/></doc>
      responses:
        "200":
          description: The transformed document
          content:
            application/xml: {}
  /format:
    post:
      operationId: formatDocument
      summary: Renders an XSL-FO document as PDF with Apache FOP (configured by fop.xconf)
      requestBody:
        description: >
          An XSL-FO document. Swagger UI cannot show XML examples without a schema of the XML,
          so replace its placeholder with your document (or the example below).
        required: true
        content:
          application/xml:
            schema:
              type: string
            examples:
              hello:
                value: |
                  <fo:root xmlns:fo="http://www.w3.org/1999/XSL/Format">
                    <fo:layout-master-set>
                      <fo:simple-page-master master-name="A4" page-height="297mm" page-width="210mm">
                        <fo:region-body margin="20mm"/>
                      </fo:simple-page-master>
                    </fo:layout-master-set>
                    <fo:page-sequence master-reference="A4">
                      <fo:flow flow-name="xsl-region-body">
                        <fo:block font-size="18pt" font-weight="bold">Hello from Expro</fo:block>
                        <fo:block>This PDF was rendered by p:xsl-formatter with Apache FOP.</fo:block>
                      </fo:flow>
                    </fo:page-sequence>
                  </fo:root>
      responses:
        "200":
          description: The PDF document
          content:
            application/pdf: {}
  /uploads:
    post:
      operationId: uploadDocuments
      summary: Describes the uploaded files
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
                comment:
                  type: string
      responses:
        "201":
          description: A description of the uploaded files
          content:
            application/json: {}
  /echo:
    get:
      operationId: echoRequest
      summary: Returns the request as the pipeline sees it
      parameters:
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
        - name: session
          in: cookie
          schema:
            type: string
      responses:
        "200":
          description: The request
          content:
            application/json: {}
  /fail:
    get:
      operationId: failAlways
      summary: Raises an error, reported as an RFC 9457 problem
      responses:
        default:
          description: A problem
          content:
            application/problem+xml: {}
